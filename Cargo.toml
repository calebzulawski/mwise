[package]
name = "mwise"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "mwise provides portable vectorized elementwise implementations of basic libm functions"
repository = "https://github.com/calebzulawski/mwise"
categories = ["mathematics", "hardware-support"]

[workspace]
members = ["tools"]
default-members = ["."]

[features]
# Use software math implementations even when the target supports hardware math.
force-soft = []

[dev-dependencies]
mwise-tools = { path = "tools", default-features = false }
paste = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
