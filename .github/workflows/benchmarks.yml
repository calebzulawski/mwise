name: Benchmarks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install benchmark dependencies
        run: python -m pip install -r benches/requirements.txt
      - name: Run benchmarks
        run: python benches/run.py
      - name: Generate benchmark report
        run: python benches/report.py target/benchmarks/results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.os }}
          path: |
            target/benchmarks/results.json
            target/benchmarks/*.html
          if-no-files-found: error

  benchmark-wasm:
    name: Benchmarks (WASM on x86 Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '49.0.2'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install benchmark dependencies
        run: python -m pip install -r benches/requirements.txt
      - name: Run WASM benchmarks
        run: python benches/run.py --target wasm32-wasip1
      - name: Generate WASM benchmark report
        run: python benches/report.py target/benchmarks-wasm/results.json
      - name: Upload WASM benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-wasm32-wasip1
          path: |
            target/benchmarks-wasm/results.json
            target/benchmarks-wasm/*.html
          if-no-files-found: error

  publish:
    name: Publish interactive benchmarks
    needs: [benchmark, benchmark-wasm]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmarks-*
          path: target/benchmark-artifacts
      - name: Merge platform results into one report
        run: |
          python benches/report.py target/benchmark-artifacts/*/results.json \
            --output target/benchmark-site/benchmarks/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/benchmark-site
      - name: Deploy benchmark report
        id: deployment
        uses: actions/deploy-pages@v5
